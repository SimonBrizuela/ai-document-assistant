spring:
  application:
    name: ai-document-assistant
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiassistant}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    jwt:
      secret: ${JWT_SECRET:default-secret-key-change-in-production-min-256-bits}
      expiration: ${JWT_EXPIRATION:86400000}
  
  ai:
    provider: ${AI_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4-turbo-preview}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      max-tokens: ${OPENAI_MAX_TOKENS:2000}
      temperature: ${OPENAI_TEMPERATURE:0.7}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-sonnet-20240229}
    
    rate-limit:
      requests-per-minute: ${AI_RATE_LIMIT:10}
      tokens-per-day: ${AI_TOKEN_LIMIT:100000}
    
    prompt:
      version: v1
      base-path: classpath:prompts/
    
    cost:
      alert-threshold: ${AI_COST_THRESHOLD:100.0}
  
  storage:
    type: ${STORAGE_TYPE:s3}
    s3:
      bucket: ${AWS_S3_BUCKET:ai-assistant-documents}
      region: ${AWS_REGION:us-east-1}
    local:
      path: ${LOCAL_STORAGE_PATH:./storage}
  
  document:
    max-size-mb: 10
    allowed-types: pdf,txt,docx
    chunk-size: 1000
    chunk-overlap: 200
    retention-days: 0
  
  conversation:
    retention-days: 90
    max-history: 10
  
  audit:
    retention-days: 365
    log-pii: false

logging:
  level:
    root: INFO
    com.aiassistant: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30
